name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  lint_and_test:
    name: Linting and Testing (PG ${{ matrix.postgres-version }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Postgres major the replication sources run in prod (pg_version_survey, 2026-11-02).
        postgres-version: [ "14", "16", "17", "18" ]
        python-version: [ "3.12" ]
        include:
          - postgres-version: "18"
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PG DB container
        env:
          PG_MAJOR: ${{ matrix.postgres-version }}
        run: make start_db

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup virtual environment
        run: make venv

      - name: Pylinting
        run: make pylint

      - name: Unit tests
        run: make unit_test_cov

      - name: Integration tests
        env:
          LOGGING_CONF_FILE: ./sample_logging.conf
        run: make integration_test_cov

      - name: Check Total test coverage
        run: make total_cov
