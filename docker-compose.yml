services:
  db_primary:
    container_name: "primary"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PG_MAJOR: ${PG_MAJOR:-17}
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=my-secret-passwd
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=16
      -c max_replication_slots=16
      -c output_plugin_libraries=wal2json
      -c client_min_messages=error
    volumes:
      - ./db_setup/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
